name: Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MkDocs strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked documentation tooling
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements-tools.lock"
      - name: Validate backlog issue sources
        run: python .github/scripts/backlog.py check
      - name: Build (warnings, broken links and nav problems fail the build)
        run: mkdocs build --strict
      - name: Summary
        run: |
          {
            echo "## 📚 PhotoProof docs"
            echo ""
            echo "✅ \`mkdocs build --strict\` passed — $(find site -name '*.html' | wc -l) pages."
            echo ""
            echo "Publication is handled by Read the Docs (.readthedocs.yaml)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          retention-days: 7
