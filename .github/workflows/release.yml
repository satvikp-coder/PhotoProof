name: Release

# Maintainer-controlled: runs only when a maintainer pushes a tag vMAJOR.MINOR.PATCH.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag matches app.toml and CHANGELOG has a dated section
        run: python .github/scripts/governance.py release-notes --tag "$GITHUB_REF_NAME" > notes.md
      - name: Refuse duplicate releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists"; exit 1
          fi
      - name: Install and test
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-tools.lock
          python -m pip install --no-deps --no-build-isolation -e .
          pytest -q
      - name: Build distributions
        run: |
          python -m build --no-isolation
          python .github/scripts/governance.py version --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md

  publish:
    name: Publish GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create release (no PyPI publication)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "PhotoProof $GITHUB_REF_NAME" --notes-file notes.md
