name: PR governance

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  governance:
    name: Title · issue · version · changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check pull request
        env:  # passed through env, never interpolated into the script
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: origin/${{ github.base_ref }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          python .github/scripts/governance.py pr --base "$BASE" --title "$TITLE" \
            --body-file "$RUNNER_TEMP/body.md" --labels "$LABELS"
