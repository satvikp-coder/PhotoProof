name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  dependencies:
    name: Dependency audit and lockfile integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lockfiles are pinned and hashed
        run: |
          python - <<'PY'
          import importlib.util, pathlib, re, sys, tomllib
          spec = importlib.util.spec_from_file_location("launcher", "main.py")
          launcher = importlib.util.module_from_spec(spec)
          sys.modules["launcher"] = launcher
          spec.loader.exec_module(launcher)
          for lock in ("requirements.lock", "requirements-dev.lock", "requirements-tools.lock"):
              launcher.verify_lockfile(pathlib.Path("."), lock)
          locked = {m.lower().replace("_", "-") for m in re.findall(r"^([A-Za-z0-9_.-]+)==", pathlib.Path("requirements.lock").read_text(), re.M)}
          deps = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          missing = [d for d in deps if re.split(r"[<>=!~ \[]", d)[0].lower().replace("_", "-") not in locked]
          assert not missing, f"pyproject dependencies missing from requirements.lock: {missing}"
          print("lockfiles OK")
          PY
      - name: Install audit tooling from the locked dev requirements
        run: "python -m pip install --require-hashes --only-binary :all: -r requirements-tools.lock"
      - name: pip-audit (known vulnerabilities)
        run: >-
          pip-audit --require-hashes --disable-pip -r requirements.lock -r requirements-dev.lock
          -r requirements-tools.lock

  static-analysis:
    name: Static security analysis (Bandit) and security policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-tools.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Bandit
        run: bandit -c pyproject.toml -r src main.py
      - name: Security-relevant configuration tests
        run: pytest tests/security -q

  secrets:
    name: Secret scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
