name: Dependency updates

on:
  schedule:
    - cron: "17 2 * * 1"  # weekly, Monday 02:17 UTC
  workflow_dispatch:
    inputs:
      upgrade_package:
        description: "Single package to upgrade (optional, e.g. Pillow)"
        required: false
      upgrade_all:
        description: "Upgrade all packages to latest allowed versions"
        required: false
        type: boolean
        default: "false"

permissions:
  contents: write
  pull-requests: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  FORCE_COLOR: "1"
  UV_VERSION: "0.12.19"

jobs:
  deps:
    name: Regenerate lockfiles and open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install uv==${UV_VERSION}
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check for existing open dependency PR
        id: existing_pr
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --search "deps" --json number,title,state --jq '.[].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "found=$existing" >> "$GITHUB_OUTPUT"
          else
            echo "found=" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip if a dependency PR is already open
        if: steps.existing_pr.outputs.found != ''
        run: |
          echo "A dependency PR (#${{ steps.existing_pr.outputs.found }}) is already open. Skipping."
          exit 0
      - name: Regenerate lockfiles
        id: regenerate
        run: |
          set -e
          if [ "${{ github.event.inputs.upgrade_package }}" != "" ]; then
            uv pip compile pyproject.toml --group build --universal --python-version 3.11 --generate-hashes --upgrade-package "${{ github.event.inputs.upgrade_package }}" -o requirements.lock
            uv pip compile pyproject.toml --group build --group dev --universal --python-version 3.11 --generate-hashes --upgrade-package "${{ github.event.inputs.upgrade_package }}" -o requirements-dev.lock
          elif [ "${{ github.event.inputs.upgrade_all }}" = "true" ]; then
            uv pip compile pyproject.toml --group build --universal --python-version 3.11 --generate-hashes --upgrade -o requirements.lock
            uv pip compile pyproject.toml --group build --group dev --universal --python-version 3.11 --generate-hashes --upgrade -o requirements-dev.lock
          else
            uv lock --locked --upgrade-package uv
          fi
          # Check whether anything changed
          if git diff --quiet requirements.lock requirements-dev.lock requirements-tools.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          UV_NO_CACHE: "1"
      - name: Skip when nothing changed
        if: steps.regenerate.outputs.changed == 'false'
        run: |
          echo "No lockfile changes; nothing to do."
          exit 0
      - name: Create branch
        run: |
          git config user.name "PhotoProof dependency automation"
          git config user.email "deps@photoproof.local"
          git checkout -b deps/auto-$(date +%Y%m%d)-$(date +%s)
      - name: Bump PATCH version and add changelog entry
        run: |
          python .github/scripts/governance.py deps-pr \
            --changelog CHANGELOG.md \
            --app-toml app.toml \
            --changed-packages "$(git diff --name-only requirements.lock requirements-dev.lock requirements-tools.lock | tr '\n' ', ')"
      - name: Install dev dependencies from regenerated lockfiles
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run test suite
        id: tests
        run: |
          set +e
          pytest tests/unit -q > /tmp/test-output.txt 2>&1
          code=$?
          cat /tmp/test-output.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Label PR as draft on test failure
        if: steps.tests.outputs.code != '0'
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base main --json number --jq '.[0].number')
          gh pr edit --repo "$GITHUB_REPOSITORY" "$pr_number" --draft --add-label "ci:blocked"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git add requirements.lock requirements-dev.lock requirements-tools.lock app.toml CHANGELOG.md
          git commit -m "build(deps): regenerate lockfiles and bump PATCH version"
      - name: Push branch and open PR
        run: |
          git push origin deps/auto-$(date +%Y%m%d)-$(date +%s)
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --title "build(deps): regenerate lockfiles and bump PATCH version" \
            --body "Regenerates hash-pinned lockfiles with uv, bumps the PATCH version and updates CHANGELOG.md.

This PR is opened by the weekly dependency update workflow (#78). It is **not** auto-merged; a maintainer reviews and merges it after CI passes.

If tests fail, the PR is left in draft with the \`ci:blocked\` label.

Closes #78" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
