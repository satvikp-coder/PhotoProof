name: Dependency updates

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      upgrade_package:
        description: "Single package name to upgrade (optional)"
        required: false
        type: string
      upgrade_all:
        description: "Upgrade all packages to latest allowed versions"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependency-update
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  UV_VERSION: "0.12.19"
  UV_SHA256: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"

jobs:
  deps:
    name: Regenerate lockfiles and open draft PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPGRADE_PACKAGE: ${{ inputs.upgrade_package }}
      UPGRADE_ALL: ${{ inputs.upgrade_all }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check for an existing automation PR
        id: existing
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open \
            --json number,headRefName | python -c 'import json,sys; print(next((p["number"] for p in json.load(sys.stdin) if p["headRefName"].startswith("deps/auto")), ""))')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Verify pinned uv archive
        if: steps.existing.outputs.number == ''
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/uv.tar.gz"
          printf '%s  %s\n' "$UV_SHA256" "$RUNNER_TEMP/uv.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Regenerate all universal lockfiles
        id: regenerate
        if: steps.existing.outputs.number == ''
        shell: bash
        run: |
          set -euo pipefail
          upgrade=()
          if [[ -n "$UPGRADE_PACKAGE" ]]; then
            if [[ ! "$UPGRADE_PACKAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo 'upgrade_package must be a package name' >&2
              exit 1
            fi
            upgrade=(--upgrade-package "$UPGRADE_PACKAGE")
          elif [[ "$UPGRADE_ALL" == true || "$EVENT_NAME" == schedule ]]; then
            upgrade=(--upgrade)
          fi
          common=(pyproject.toml --group build --universal --python-version 3.11 --generate-hashes)
          uv pip compile "${common[@]}" "${upgrade[@]}" -o requirements.lock
          uv pip compile "${common[@]}" --group dev "${upgrade[@]}" -o requirements-dev.lock
          uv pip compile "${common[@]}" --group dev --group docs --group security \
            "${upgrade[@]}" -o requirements-tools.lock
          if git diff --quiet -- requirements.lock requirements-dev.lock requirements-tools.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install generated locked dependencies
        if: steps.regenerate.outputs.changed == 'true'
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-tools.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate generated dependencies
        id: checks
        if: steps.regenerate.outputs.changed == 'true'
        continue-on-error: true
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest
          mkdocs build --strict
          bandit -c pyproject.toml -r src main.py
          python -m build --no-isolation
      - name: Publish a draft for human review
        if: steps.regenerate.outputs.changed == 'true' && !cancelled()
        env:
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
        run: |
          git config user.name 'PhotoProof dependency automation'
          git config user.email 'deps@photoproof.local'
          branch="deps/auto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('## [Unreleased]', '## [Unreleased]\n\n### Changed\n\n'
                              '- Refresh hash-pinned dependency lockfiles (Refs #78).', 1)
          p.write_text(text, encoding='utf-8')
          PY
          git add requirements.lock requirements-dev.lock requirements-tools.lock CHANGELOG.md
          git commit -m 'build(deps): refresh hash-pinned dependency lockfiles'
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/deps-pr.md" <<'BODY'
          ## Summary
          Refresh all three universal hash-pinned dependency lockfiles.
          ## Motivation
          Keep supported dependencies current through a reviewable draft.
          ## Related issue
          Refs #78
          ## Scope of changes
          Lockfiles and their changelog entry only.
          ## Implementation details
          Regenerated with the checksum-verified pinned uv archive and documented groups.
          ## Test evidence
          BODY
          printf 'Generated-environment checks: **%s**. See this workflow run for logs.\n' \
            "$CHECK_OUTCOME" >> "$RUNNER_TEMP/deps-pr.md"
          cat >> "$RUNNER_TEMP/deps-pr.md" <<'BODY'
          ## Documentation changes
          None; dependency policy remains unchanged.
          ## Version impact
          PATCH; app.toml is unchanged.
          ## Changelog entry
          Refresh hash-pinned dependency lockfiles (Refs #78).
          ## Compatibility considerations
          Full PR matrix validation is still required before merging.
          ## Security considerations
          Hash-pinned, wheels-only installation; no automatic merge.
          ## Screenshots or execution examples
          Not applicable to dependency updates.
          ## Checklist
          - [x] Dedicated dependency branch
          - [x] All three lockfiles regenerated together
          - [x] No application version change or user data
          BODY
          labels=()
          if [[ "$CHECK_OUTCOME" != success ]]; then labels=(--label ci:blocked); fi
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --draft \
            --title 'build(deps): refresh hash-pinned dependency lockfiles' \
            --body-file "$RUNNER_TEMP/deps-pr.md" "${labels[@]}"; then
            echo '::warning::Draft PR publication failed; generated changes are preserved on the branch below.'
            {
              echo '## Manual draft publication required'
              echo 'The repository may restrict PR creation by GitHub Actions. No settings were changed.'
              echo "Validated check outcome: $CHECK_OUTCOME"
              echo "Preserved branch: $branch"
              echo "Compare: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
              echo 'Open a draft manually, then run the complete required CI and review gates.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report validation failure
        if: steps.checks.outcome == 'failure'
        run: exit 1
