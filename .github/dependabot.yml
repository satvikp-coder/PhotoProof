# Dependabot updates pyproject.toml constraints and GitHub Actions pins.
# Lockfiles are regenerated by the reviewer with the uv commands in CONTRIBUTING.md §1.8,
# and the PR must still bump the PATCH version and update CHANGELOG.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["type:maintenance", "area:CI"]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels: ["type:maintenance", "area:CI"]
    groups:
      actions:
        patterns: ["*"]
