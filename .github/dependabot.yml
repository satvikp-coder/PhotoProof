# Dependabot updates GitHub Actions pins and dependency-review alerts.
# Lockfiles are regenerated by the weekly deps.yml workflow (CONTRIBUTING.md §1.8).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Only open PRs for security vulnerabilities; general updates go through deps.yml.
    groups:
      security:
        update-types: ["security"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["type:maintenance", "area:CI", "security"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels: ["type:maintenance", "area:CI"]
    groups:
      actions:
        patterns: ["*"]
