# Authoritative application identity. `version` below is the ONLY place the
# application version is written; packaging derives it from this file.

[application]
name = "PhotoProof"
version = "0.2.5"
package = "photoproof"
description = "Modular digital image forgery detection and localization framework."
release_channel = "development"   # development | preview | stable
plugin_api_version = "1.0.0"
config_schema_version = 1

[[developers]]
name = "Varun Karthic"
github = "varunkarthic"

[[developers]]
name = "Satvik Patel"
github = "satvikp-coder"

[[developers]]
name = "Garv Gurwara"
github = "inevitable-lettus"

[[developers]]
name = "Shambhavee"
github = "shambhavee08"

[python]
minimum = "3.11"   # inclusive
maximum = "3.15"   # inclusive (minor version)

[platform]
operating_systems = ["Linux", "Darwin", "Windows"]
architectures = ["x86_64", "arm64"]

[hardware]
min_cpu_cores = 1
recommended_cpu_cores = 2
min_memory_mb = 2048
recommended_memory_mb = 4096
min_free_disk_mb = 1024
gpu = "optional"
