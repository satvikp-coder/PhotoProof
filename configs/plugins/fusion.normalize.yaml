# Provisional uncalibrated mappings of actual measured native contracts.
# Diagnostics (tables, counts, raw residuals/sigma and summaries) are context only.
mappings:
  # Recompression differences are content/save dependent: weak supportive evidence.
  compression.ela_anomaly:
    method: robust_z
    z0: 3.0
    k: 1.5
    strength_class: weak
  # Double-quantization anomalies can also reflect benign re-saving: provisional medium.
  compression.dq_map:
    method: robust_z
    z0: 2.5
    k: 1.0
    strength_class: medium
  # Grid misalignment also occurs after legitimate cropping: weak.
  compression.grid_map:
    method: robust_z
    z0: 3.0
    k: 1.5
    strength_class: weak
  # Both positive and negative native robust-z deviations matter; low quality weakens this.
  noise.consistency_map:
    method: robust_z
    z0: 2.5
    k: 1.0
    strength_class: medium
  # Only artifact-bound verified dense support; any caution downgrades to weak.
  copymove.mask:
    method: identity
    minimum_geometric_support: 0.8
    strength_class: strong
