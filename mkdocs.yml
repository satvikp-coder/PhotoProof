site_name: PhotoProof
site_description: Modular digital image forgery detection and localization framework
repo_url: https://github.com/satvikp-coder/PhotoProof
repo_name: satvikp-coder/PhotoProof
edit_uri: edit/main/docs/
copyright: Varun Karthic, Satvik Patel, Garv Gurwara, Shambhavee · MIT License

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false  # system fonts: no external requests
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

# Issue sources are published to GitHub Issues; the generated backlog page indexes them.
exclude_docs: |
  planning/backlog/

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

nav:
  - Home: index.md
  - Architecture:
      - architecture/index.md
      - Execution lifecycle: architecture/lifecycle.md
      - Repository structure: architecture/repository.md
      - Architectural decisions: architecture/decisions.md
  - Plugins:
      - plugins/index.md
  - Configuration:
      - configuration/index.md
      - app.toml: configuration/app-toml.md
      - settings.yaml: configuration/settings.md
      - Flags, blacklist and profiles: configuration/policy.md
  - Operations:
      - operations/index.md
      - Health checks and repair: operations/health.md
      - Runtime storage, cache, logs, manifests: operations/runtime.md
      - Troubleshooting: operations/troubleshooting.md
  - Security:
      - security/index.md
  - Development:
      - development/index.md
      - Contributor work-allocation: development/workflow.md
      - Versioning and releases: development/releases.md
      - CI/CD and repository settings: development/ci.md
  - Testing:
      - testing/index.md
  - Planning:
      - Roadmap: planning/index.md
      - Backlog: planning/backlog.md
      - Team: planning/team.md
      - ADR-003 Optional Plugin Inputs: planning/adr-003-optional-inputs.md
      - ADR-004 Rule-Based Evidence Fusion: planning/adr-004-rule-based-fusion.md
      - ADR-005 Evidence Sufficiency: planning/adr-005-evidence-sufficiency.md
      - ADR-013 Reference Comparison: planning/adr-013-reference-comparison-preflight.md
      - ADR-014 Verified Artifact Inputs: planning/adr-014-verified-artifact-inputs.md
      - ADR-015 Image Coordinates: planning/adr-015-image-coordinate-contract.md
      - ADR-016 Spatial Evidence Grids: planning/adr-016-spatial-evidence-grids.md
      - ADR-017 Binary Evidence Layers: planning/adr-017-binary-evidence-layer-wire.md
      - ADR-018 Upstream Execution Status: planning/adr-018-upstream-execution-status.md
      - ADR-027 Reference Registration: planning/adr-027-reference-registration.md
      - ADR-028 Overlap SSIM: planning/adr-028-overlap-ssim.md
      - ADR-029 Comparison Change Regions: planning/adr-029-comparison-change-regions.md
