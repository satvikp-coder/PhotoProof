[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoproof"
version = "0.1.0"
description = "An educational image-forensics prototype for manipulation signal visualization"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PhotoProof Contributors" }]
dependencies = [
  "numpy>=1.26,<3.0",
  "opencv-python-headless>=4.9,<5.0",
  "Pillow>=10.0,<13.0",
  "streamlit>=1.36,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
