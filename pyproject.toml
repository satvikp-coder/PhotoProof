[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "photoproof"
dynamic = ["version"]  # derived from app.toml, see [tool.hatch.version]
description = "Modular digital image forgery detection and localization framework."
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PhotoProof Contributors" }]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.9,<3",
  "ruamel.yaml>=0.18,<0.20",  # pure-Python wheel: installs on every supported version
]

[project.scripts]
photoproof = "photoproof.cli:main"

[dependency-groups]
build = ["hatchling>=1.25"]
# dev: installable on every supported Python (wheel-only). docs/security tools pull in
# PyYAML and watchdog, which lack wheels for the newest Pythons, so they are locked
# separately in requirements-tools.lock and run on Python 3.12 in CI.
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "build>=1.2",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
security = ["bandit>=1.8", "pip-audit>=2.7"]

[tool.hatch.version]
path = "app.toml"
pattern = '(?m)^version = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/photoproof"]
dev-mode-dirs = ["src"]  # editable installs use a .pth file (no `editables` dependency)

[tool.hatch.build.targets.sdist]
include = ["src/photoproof", "app.toml", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["context"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "PLC0415"]
"main.py" = ["S603", "PLC0415", "UP036"]  # must run (and fail clearly) on old interpreters
".github/scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/fixtures"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["photoproof"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# subprocess is only used with argument lists (never shell=True, which B602 still flags)
skips = ["B404", "B603"]
