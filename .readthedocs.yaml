# Read the Docs build configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      # The virtualenv's seed pip (23.1) rejects a hashed lock that mentions extras such
      # as coverage[toml]; a current pip reconciles them with the pinned versions.
      - "python -m pip install --upgrade pip"
      - "python -m pip install --require-hashes --only-binary :all: -r requirements-tools.lock"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
